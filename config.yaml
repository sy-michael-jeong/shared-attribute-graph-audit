seed: 42
device: auto

data:
  test_size: 0.20
  val_size: 0.10

hin:
  # The requested relations differ by dataset. BCCC-DoH and CIC-AndMal request
  # the TLS relations only: in those two corpora the host relations read the
  # capture setup rather than the traffic (infected hosts sit on a handful of
  # addresses) and the temporal relation reads the capture schedule, so
  # requesting them would let the graph learn the collection procedure instead
  # of the data (paper, Section 3.2). The other three datasets request all ten;
  # relations that do not materialize are listed with a reason under `skipped`
  # in hin_summary.json by build_graph.py.
  #
  # Without this distinction, "not realized" and "never requested" would be
  # indistinguishable in the result files.
  metapaths:
    - via_sni
    - via_ja3
    - via_cert_subject
    - via_alpn
    - via_cert_issuer
    - via_tls_cipher_group
    - via_cert_validity
    - via_src_host
    - via_dst_host
    - via_timebin
  metapaths_by_dataset:
    bccc_dohbrw: &tls_only
      - via_sni
      - via_ja3
      - via_cert_subject
      - via_alpn
      - via_cert_issuer
      - via_tls_cipher_group
      - via_cert_validity
    cic_andmal: *tls_only
  max_degree_per_value: 2
  timebin_seconds: 300

classifier:
  hidden: 128
  num_layers: 2
  heads: 4
  dropout: 0.5
  residual: true
  lr: 0.005
  weight_decay: 0.0005
  epochs: 100
  patience: 15
  class_weight: balanced
